# Postgres for the whole book. Host port 5433 (not 5432) so it never clashes
# with a Postgres you may already have installed on your computer.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rbh
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/..., so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Check over TCP (127.0.0.1), not the Unix socket: the temporary first-start
      # server only listens on the socket, so a socket check reports healthy too
      # early. The TCP check only passes once Postgres is really ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d rbh"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
