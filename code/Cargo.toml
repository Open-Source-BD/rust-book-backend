[workspace]
resolver = "3"
members = ["topics/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
