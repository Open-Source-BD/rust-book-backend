name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install mdBook
        run: curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz --directory=/usr/local/bin
      - name: Tool tests
        run: npm test
      - name: Generate
        run: node tools/generate.mjs
      - name: Validate
        run: node tools/validate.mjs
      - name: Build book
        # mdBook exits 0 even when a preprocessor fails (e.g. an {{#include}} it can't read), so
        # also fail on any ERROR line it prints. The default shell is `bash -e {0}` (no pipefail):
        # set pipefail so a failing `mdbook build` isn't hidden behind `tee`'s exit status.
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          mdbook build 2>&1 | tee mdbook.log
          if grep -Eq '(^|[[:space:]])ERROR[[:space:]]' mdbook.log; then
            echo "::error::mdBook printed an ERROR line (see the log above)"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: ./book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
